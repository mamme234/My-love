<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY QUEEN ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at center,
    #300015 0%,
    #120008 45%,
    #000 100%);

    font-family:Arial,sans-serif;
}

/* ===================== */
/* BIOMETRIC SCREEN */
/* ===================== */

#scanScreen{
    position:fixed;
    inset:0;
    background:black;
    z-index:9999;
    overflow:hidden;
}

.cameraGlow{
    position:absolute;

    width:800px;
    height:800px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(255,0,120,0.18),
    transparent 70%);

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    filter:blur(70px);

    animation:pulse 3s infinite alternate;
}

@keyframes pulse{

    from{
        transform:
        translate(-50%,-50%)
        scale(1);

        opacity:0.5;
    }

    to{
        transform:
        translate(-50%,-50%)
        scale(1.2);

        opacity:1;
    }
}

/* face cards */

.faceBox{
    position:absolute;

    width:250px;
    height:320px;

    top:50%;

    transform:translateY(-50%);

    border-radius:30px;

    overflow:hidden;

    border:
    2px solid rgba(255,255,255,0.2);

    box-shadow:
    0 0 30px rgba(255,0,120,0.3);
}

.leftBox{
    left:8%;
}

.rightBox{
    right:8%;
}

.face{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* corners */

.corner{
    position:absolute;
    width:40px;
    height:40px;
    border:4px solid hotpink;
}

.tl{
    top:10px;
    left:10px;
    border-right:none;
    border-bottom:none;
}

.tr{
    top:10px;
    right:10px;
    border-left:none;
    border-bottom:none;
}

.bl{
    bottom:10px;
    left:10px;
    border-right:none;
    border-top:none;
}

.br{
    bottom:10px;
    right:10px;
    border-left:none;
    border-top:none;
}

/* scan line */

.scanLine{
    position:absolute;

    width:100%;
    height:5px;

    background:
    linear-gradient(
    90deg,
    transparent,
    hotpink,
    white,
    hotpink,
    transparent);

    box-shadow:
    0 0 25px hotpink,
    0 0 50px deeppink;

    animation:scanMove 2s linear infinite;
}

@keyframes scanMove{

    from{
        top:0;
    }

    to{
        top:100%;
    }
}

/* mesh */

.mesh{
    position:absolute;
    inset:0;

    background-image:
    radial-gradient(
    rgba(255,105,180,0.8) 1px,
    transparent 1px);

    background-size:24px 24px;

    opacity:0.3;

    animation:rotateMesh 10s linear infinite;
}

@keyframes rotateMesh{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* center ring */

.ring{
    position:absolute;

    width:180px;
    height:180px;

    border-radius:50%;

    border:3px solid hotpink;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    box-shadow:
    0 0 20px hotpink,
    inset 0 0 20px hotpink;

    animation:ringPulse 2s infinite;
}

@keyframes ringPulse{

    0%{
        transform:
        translate(-50%,-50%)
        scale(1);

        opacity:1;
    }

    100%{
        transform:
        translate(-50%,-50%)
        scale(1.4);

        opacity:0;
    }
}

/* scan text */

.scanText{
    position:absolute;

    bottom:10%;

    width:100%;

    text-align:center;

    color:white;

    font-size:32px;

    letter-spacing:6px;

    text-shadow:
    0 0 10px pink,
    0 0 20px deeppink;

    animation:blink 1s infinite;
}

@keyframes blink{

    50%{
        opacity:0.5;
    }
}

/* ===================== */
/* MAIN */
/* ===================== */

.bgGlow{
    position:fixed;

    width:700px;
    height:700px;

    border-radius:50%;

    background:
    rgba(255,120,180,0.1);

    filter:blur(120px);
}

.container{
    position:relative;

    animation:movieFade 2s ease;
}

@keyframes movieFade{

    from{
        opacity:0;
        transform:scale(0.95);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

canvas{

    background:white;

    border-radius:25px;

    max-width:92vw;
    max-height:88vh;

    image-rendering:auto;

    box-shadow:
    0 0 25px rgba(255,255,255,0.2),
    0 0 80px rgba(255,120,180,0.25);

    animation:cinemaGlow 4s infinite alternate;
}

@keyframes cinemaGlow{

    from{

        transform:scale(1);

        box-shadow:
        0 0 20px rgba(255,255,255,0.2),
        0 0 60px rgba(255,0,120,0.2);
    }

    to{

        transform:scale(1.01);

        box-shadow:
        0 0 40px rgba(255,255,255,0.4),
        0 0 120px rgba(255,0,120,0.4);
    }
}

/* hand */

#hand{
    position:absolute;

    width:170px;

    z-index:5;

    pointer-events:none;

    transition:all 0.03s linear;

    filter:
    drop-shadow(0 0 15px rgba(0,0,0,0.5))
    drop-shadow(0 0 25px rgba(255,120,180,0.4));
}

/* title */

.title{
    position:absolute;

    width:100%;

    bottom:-100px;

    text-align:center;

    color:white;

    font-size:24px;

    line-height:1.8;

    letter-spacing:3px;

    animation:glow 2s infinite alternate;
}

@keyframes glow{

    from{
        opacity:0.7;
        text-shadow:0 0 5px pink;
    }

    to{
        opacity:1;

        text-shadow:
        0 0 10px pink,
        0 0 20px hotpink,
        0 0 40px deeppink;
    }
}

/* hearts */

.heart{
    position:fixed;

    pointer-events:none;

    z-index:1;

    animation:float 6s linear forwards;
}

@keyframes float{

    from{
        transform:
        translateY(0)
        scale(1);
    }

    to{
        transform:
        translateY(-150px)
        scale(1.5);
    }
}

</style>
</head>
<body>

<!-- ===================== -->
<!-- BIOMETRIC -->
<!-- ===================== -->

<div id="scanScreen">

    <div class="cameraGlow"></div>

    <!-- YOUR PHOTO -->

    <div class="faceBox leftBox">

        <img src="me.jpg" class="face">

        <div class="mesh"></div>

        <div class="scanLine"></div>

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

    </div>

    <!-- HER PHOTO -->

    <div class="faceBox rightBox">

        <img src="her.jpg" class="face">

        <div class="mesh"></div>

        <div class="scanLine"></div>

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

    </div>

    <div class="ring"></div>

    <div class="scanText">
        BIOMETRIC LOVE MATCH ❤️
    </div>

</div>

<!-- ===================== -->
<!-- MAIN -->
<!-- ===================== -->

<div class="bgGlow"></div>

<div class="container">

    <canvas id="canvas"></canvas>

    <img id="hand"
    src="https://pngimg.com/d/paint_brush_PNG24.png">

    <div class="title">
        MY QUEEN ❤️
    </div>

</div>

<script>

/* ===================== */
/* AUDIO */
/* ===================== */

const audioCtx =
new (window.AudioContext ||
window.webkitAudioContext)();

function tone(freq,time,duration){

    const osc =
    audioCtx.createOscillator();

    const gain =
    audioCtx.createGain();

    osc.type = "sine";

    osc.frequency.value = freq;

    gain.gain.setValueAtTime(
        0,
        audioCtx.currentTime
    );

    gain.gain.linearRampToValueAtTime(
        0.03,
        audioCtx.currentTime + 0.1
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + duration
    );

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start(time);

    osc.stop(time + duration);
}

function playMusic(){

    const notes = [
        261.63,
        329.63,
        392.00,
        523.25,
        659.25,
        523.25
    ];

    let t = audioCtx.currentTime;

    notes.forEach((n,i)=>{

        tone(
            n,
            t + i*0.4,
            1
        );

    });

    setTimeout(playMusic,3000);
}

document.body.addEventListener(
"click",
()=>{
    audioCtx.resume();
    playMusic();
},{
    once:true
});

/* ===================== */
/* HEARTS */
/* ===================== */

function createHeart(){

    const h =
    document.createElement("div");

    h.className = "heart";

    h.innerHTML = "❤️";

    h.style.left =
    Math.random()*window.innerWidth
    + "px";

    h.style.bottom = "-20px";

    h.style.fontSize =
    (Math.random()*20 + 10)
    + "px";

    h.style.opacity =
    Math.random();

    document.body.appendChild(h);

    setTimeout(()=>{
        h.remove();
    },6000);
}

setInterval(createHeart,300);

/* ===================== */
/* DRAWING */
/* ===================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const hand =
document.getElementById("hand");

const title =
document.querySelector(".title");

const img = new Image();

img.src = "photo.jpg";

function startDrawing(){

    img.onload = ()=>{

        const scale = 1.5;

        canvas.width =
        img.width * scale;

        canvas.height =
        img.height * scale;

        ctx.scale(scale,scale);

        ctx.fillStyle = "white";

        ctx.fillRect(
            0,
            0,
            img.width,
            img.height
        );

        const hidden =
        document.createElement("canvas");

        hidden.width = img.width;
        hidden.height = img.height;

        const hctx =
        hidden.getContext("2d");

        hctx.drawImage(
            img,
            0,
            0
        );

        const pixels =
        hctx.getImageData(
            0,
            0,
            img.width,
            img.height
        ).data;

        let y = 0;

        function drawRow(){

            if(y >= img.height){

                revealFinal();

                return;
            }

            let x = 0;

            function drawPixel(){

                if(x >= img.width){

                    y += 2;

                    requestAnimationFrame(
                        drawRow
                    );

                    return;
                }

                const i =
                (y * img.width + x) * 4;

                const r = pixels[i];
                const g = pixels[i+1];
                const b = pixels[i+2];
                const a = pixels[i+3];

                const brightness =
                (r+g+b)/3;

                if(
                    brightness < 250 &&
                    a > 0
                ){

                    ctx.beginPath();

                    ctx.strokeStyle =
                    `rgba(
                        ${r},
                        ${g},
                        ${b},
                        0.9
                    )`;

                    ctx.lineWidth =
                    Math.random()*1.8 + 0.5;

                    ctx.lineCap = "round";

                    ctx.shadowBlur = 8;

                    ctx.shadowColor =
                    `rgba(
                        ${r},
                        ${g},
                        ${b},
                        0.8
                    )`;

                    ctx.moveTo(
                        x,
                        y
                    );

                    ctx.lineTo(
                        x + Math.random()*4,
                        y + Math.random()*2
                    );

                    ctx.stroke();

                    /* hand movement */

                    hand.style.left =
                    (
                        canvas.offsetLeft +
                        x -
                        60
                    ) + "px";

                    hand.style.top =
                    (
                        canvas.offsetTop +
                        y -
                        45
                    ) + "px";

                    hand.style.transform =
                    `
                    rotate(
                        ${
                            Math.sin(x/25)*6
                        }deg
                    )
                    `;
                }

                x += 2;

                requestAnimationFrame(
                    drawPixel
                );
            }

            drawPixel();
        }

        function revealFinal(){

            let alpha = 0;

            function fadeIn(){

                alpha += 0.02;

                ctx.save();

                ctx.globalAlpha = alpha;

                ctx.shadowBlur = 25;

                ctx.shadowColor = "hotpink";

                ctx.drawImage(
                    img,
                    0,
                    0
                );

                ctx.restore();

                if(alpha < 1){

                    requestAnimationFrame(
                        fadeIn
                    );

                }else{

                    hand.style.opacity = "0";

                    title.innerHTML =
                    `
                    ✨ MY QUEEN ❤️ ✨<br>
                    You are my forever happiness ❤️
                    `;
                }
            }

            fadeIn();
        }

        drawRow();
    };

    if(img.complete){
        img.onload();
    }
}

/* ===================== */
/* START */
/* ===================== */

setTimeout(()=>{

    document
    .getElementById("scanScreen")
    .style.opacity = "0";

    setTimeout(()=>{

        document
        .getElementById("scanScreen")
        .remove();

        startDrawing();

    },1000);

},5000);

</script>

</body>
    </html>
