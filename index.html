<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY QUEEN ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at center,
    #2b0f18 0%,
    #12060d 40%,
    #000 100%);
    font-family:Arial,sans-serif;
}

/* ========================= */
/* LOVE SCAN INTRO */
/* ========================= */

#scanIntro{
    position:fixed;
    inset:0;
    background:black;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.scanBg{
    position:absolute;
    width:600px;
    height:600px;
    border-radius:50%;
    background:
    radial-gradient(circle,
    rgba(255,0,120,0.25),
    transparent 70%);
    filter:blur(50px);
    animation:pulse 3s infinite alternate;
}

@keyframes pulse{
    from{
        transform:scale(1);
        opacity:0.5;
    }
    to{
        transform:scale(1.2);
        opacity:1;
    }
}

.scanFace{
    width:220px;
    height:220px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid rgba(255,255,255,0.3);

    box-shadow:
    0 0 20px rgba(255,0,120,0.5),
    0 0 40px rgba(255,0,120,0.3);

    position:absolute;
}

.leftFace{
    left:15%;
    animation:floatFace 3s ease-in-out infinite;
}

.rightFace{
    right:15%;
    animation:floatFace 3s ease-in-out infinite reverse;
}

@keyframes floatFace{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-15px);
    }
    100%{
        transform:translateY(0px);
    }
}

/* Scan line */

.scanLine{
    position:absolute;
    width:100%;
    height:5px;

    background:
    linear-gradient(
    90deg,
    transparent,
    hotpink,
    white,
    hotpink,
    transparent);

    box-shadow:
    0 0 20px hotpink,
    0 0 40px deeppink;

    animation:scanMove 2s linear infinite;
}

@keyframes scanMove{
    from{
        top:10%;
    }

    to{
        top:90%;
    }
}

.scanText{
    position:absolute;
    bottom:12%;
    color:white;
    font-size:28px;
    letter-spacing:5px;

    text-shadow:
    0 0 10px pink,
    0 0 20px deeppink;

    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0.4;
    }
}

/* ========================= */
/* MAIN DRAWING */
/* ========================= */

.bgGlow{
    position:fixed;
    width:700px;
    height:700px;
    border-radius:50%;
    background:rgba(255,120,180,0.15);
    filter:blur(120px);
    animation:pulse 4s infinite alternate;
}

.container{
    position:relative;
    animation:fadeIn 3s ease;
}

canvas{
    background:white;
    border-radius:25px;
    max-width:90vw;
    max-height:90vh;

    box-shadow:
    0 0 20px rgba(255,255,255,0.15),
    0 0 50px rgba(255,120,180,0.2),
    0 0 100px rgba(255,120,180,0.1);
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:scale(0.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* Drawing Hand */

#hand{
    position:absolute;
    width:140px;
    pointer-events:none;
    z-index:5;

    filter:
    drop-shadow(0 0 10px rgba(0,0,0,0.5))
    drop-shadow(0 0 20px rgba(255,120,180,0.25));
}

/* Title */

.title{
    position:absolute;
    width:100%;
    bottom:-90px;
    text-align:center;
    color:white;
    font-size:24px;
    letter-spacing:3px;
    animation:glow 2s infinite alternate;
    line-height:1.7;
}

@keyframes glow{
    from{
        text-shadow:0 0 5px pink;
        opacity:0.7;
    }
    to{
        text-shadow:
        0 0 10px pink,
        0 0 20px hotpink,
        0 0 40px deeppink;
        opacity:1;
    }
}

/* Floating Hearts */

.heart{
    position:fixed;
    color:rgba(255,120,180,0.5);
    pointer-events:none;
    animation:floatUp linear infinite;
}

@keyframes floatUp{
    from{
        transform:translateY(0) scale(1);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    to{
        transform:translateY(-120vh) scale(1.8);
        opacity:0;
    }
}

/* Sparkles */

.sparkle{
    position:fixed;
    pointer-events:none;
    animation:sparkleAnim 2s linear forwards;
}

@keyframes sparkleAnim{
    0%{
        opacity:0;
        transform:scale(0.5);
    }

    50%{
        opacity:1;
        transform:scale(1.5);
    }

    100%{
        opacity:0;
        transform:scale(0.5);
    }
}

</style>
</head>
<body>

<!-- SCAN INTRO -->

<div id="scanIntro">

    <div class="scanBg"></div>

    <img src="me.jpg" class="scanFace leftFace">
    <img src="her.jpg" class="scanFace rightFace">

    <div class="scanLine"></div>

    <div class="scanText">
        LOVE SCAN INITIALIZING ❤️
    </div>

</div>

<!-- MAIN -->

<div class="bgGlow"></div>

<div class="container">

    <canvas id="canvas"></canvas>

    <!-- Drawing Hand -->
    <img id="hand"
    src="https://i.imgur.com/Q7aZK9p.png">

    <div class="title">
        MY QUEEN ❤️
    </div>

</div>

<!-- Romantic Song -->
<audio autoplay loop>
    <source src="love.mp3" type="audio/mpeg">
</audio>

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const hand = document.getElementById('hand');
const title = document.querySelector('.title');

const img = new Image();
img.src = 'photo.jpg';

img.onload = () => {

    const scale = 1.5;

    canvas.width = img.width * scale;
    canvas.height = img.height * scale;

    ctx.scale(scale,scale);

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    ctx.fillStyle = 'white';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    let y = 0;

    function draw(){

        ctx.drawImage(
            img,
            0,y,
            img.width,2,
            0,y,
            img.width,2
        );

        let imageData =
        ctx.getImageData(0,y,img.width,2);

        let data = imageData.data;

        for(let i=0;i<data.length;i+=4){

            const r = data[i];
            const g = data[i+1];
            const b = data[i+2];

            const gray =
            (r*0.3 + g*0.59 + b*0.11);

            const shade =
            gray > 150
            ? 255
            : gray * 0.45;

            data[i] = shade;
            data[i+1] = shade;
            data[i+2] = shade;
        }

        ctx.putImageData(imageData,0,y);

        // Pencil stroke lines
        ctx.beginPath();

        ctx.moveTo(
            Math.random()*20,
            y
        );

        ctx.lineTo(
            canvas.width,
            y + Math.random()*2
        );

        ctx.strokeStyle =
        'rgba(0,0,0,0.08)';

        ctx.lineWidth = 1;

        ctx.stroke();

        // Hand movement

        hand.style.left =
        (canvas.offsetLeft + canvas.width*0.60)
        + 'px';

        hand.style.top =
        (canvas.offsetTop + y - 35)
        + 'px';

        hand.style.transform =
        `rotate(${8 + Math.sin(y/20)*5}deg)`;

        y += 2;

        if(y < img.height){

            requestAnimationFrame(draw);

        }else{

            title.innerHTML = `
            Forever in my heart,<br>
            Forever in my soul,<br>
            You are the smile in my darkest nights,<br>
            The reason my world feels whole ❤️
            `;

            title.style.fontSize = '20px';

            canvas.animate([
                {
                    filter:'brightness(1)',
                    transform:'scale(1)'
                },
                {
                    filter:'brightness(1.15)',
                    transform:'scale(1.04)'
                },
                {
                    filter:'brightness(1)',
                    transform:'scale(1)'
                }
            ],{
                duration:4000
            });
        }
    }

    // Start drawing after scan intro

    setTimeout(()=>{

        document.getElementById('scanIntro')
        .style.display = 'none';

        draw();

    },5000);
}

/* Floating Hearts */

for(let i=0;i<35;i++){

    const heart =
    document.createElement('div');

    heart.className = 'heart';
    heart.innerHTML = '❤';

    heart.style.left =
    Math.random()*100 + 'vw';

    heart.style.top = '100vh';

    heart.style.fontSize =
    (15 + Math.random()*30)
    + 'px';

    heart.style.animationDuration =
    (4 + Math.random()*6)
    + 's';

    document.body.appendChild(heart);
}

/* Sparkles */

setInterval(()=>{

    const sparkle =
    document.createElement('div');

    sparkle.className = 'sparkle';

    sparkle.innerHTML = '💖';

    sparkle.style.left =
    Math.random()*100 + 'vw';

    sparkle.style.top =
    Math.random()*100 + 'vh';

    sparkle.style.fontSize =
    (15 + Math.random()*25)
    + 'px';

    document.body.appendChild(sparkle);

    setTimeout(()=>{
        sparkle.remove();
    },2000);

},300);

</script>

</body>
    </html>
