<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY QUEEN ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:
    radial-gradient(circle,#2b0f18,#000);
    font-family:Arial,sans-serif;
}

.container{
    position:relative;
}

canvas{
    width:90vw;
    max-width:700px;
    border-radius:20px;
    background:white;

    box-shadow:
    0 0 20px rgba(255,255,255,0.15),
    0 0 40px rgba(255,120,180,0.2);
}

/* Pencil */
#pencil{
    position:absolute;
    width:120px;
    z-index:10;
    pointer-events:none;
    transform-origin:center;
    filter:drop-shadow(0 0 8px rgba(0,0,0,0.4));
}

/* Title */
.title{
    position:absolute;
    width:100%;
    bottom:-90px;
    text-align:center;
    color:white;
    font-size:24px;
    letter-spacing:4px;
    line-height:1.7;

    animation:glow 2s infinite alternate;
}

@keyframes glow{

    from{
        text-shadow:0 0 5px pink;
    }

    to{
        text-shadow:
        0 0 10px hotpink,
        0 0 20px deeppink;
    }
}

/* Hearts */
.heart{
    position:fixed;
    color:rgba(255,120,180,0.5);
    animation:floatUp linear infinite;
    pointer-events:none;
}

@keyframes floatUp{

    from{
        transform:translateY(0) scale(1);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    to{
        transform:translateY(-120vh) scale(1.7);
        opacity:0;
    }
}

</style>
</head>
<body>

<div class="container">

    <canvas id="canvas"></canvas>

    <!-- Pencil -->
    <img
    id="pencil"
    src="https://i.imgur.com/9yG3Y2D.png"
    >

    <div class="title">
        MY QUEEN ❤️
    </div>

</div>

<script>

const canvas =
document.getElementById('canvas');

const ctx =
canvas.getContext('2d');

const pencil =
document.getElementById('pencil');

const title =
document.querySelector('.title');

const img = new Image();

img.src = 'photo.jpg';

img.onload = () => {

    canvas.width = img.width;
    canvas.height = img.height;

    // White paper
    ctx.fillStyle = 'white';
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    let progress = 0;

    // SPEED LIKE MBC3
    const speed = 30;

    function animate(){

        // Clear
        ctx.fillStyle = 'white';
        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        // Draw revealed image
        ctx.drawImage(
            img,
            0,
            0,
            progress,
            canvas.height,
            0,
            0,
            progress,
            canvas.height
        );

        // Pencil Sketch Look
        let imageData =
        ctx.getImageData(
            0,
            0,
            progress,
            canvas.height
        );

        let data = imageData.data;

        for(let i=0;i<data.length;i+=4){

            const r = data[i];
            const g = data[i+1];
            const b = data[i+2];

            const gray =
            (r+g+b)/3;

            const sketch =
            gray > 140
            ? 255
            : gray*0.55;

            data[i] = sketch;
            data[i+1] = sketch;
            data[i+2] = sketch;
        }

        ctx.putImageData(
            imageData,
            0,
            0
        );

        // Pencil Position
        pencil.style.left =
        (
            canvas.offsetLeft +
            progress - 40
        ) + 'px';

        pencil.style.top =
        (
            canvas.offsetTop +
            canvas.height/2
        ) + 'px';

        pencil.style.transform =
        'rotate(15deg)';

        progress += speed;

        if(progress < canvas.width){

            requestAnimationFrame(
                animate
            );

        }else{

            // Final poem
            title.innerHTML = `
            You are my light,<br>
            My peace, my queen,<br>
            My forever love ❤️
            `;

            canvas.animate([
                {
                    transform:'scale(1)'
                },
                {
                    transform:'scale(1.03)'
                },
                {
                    transform:'scale(1)'
                }
            ],{
                duration:2500
            });
        }
    }

    animate();
}

/* Romantic Hearts */

for(let i=0;i<30;i++){

    const heart =
    document.createElement('div');

    heart.className = 'heart';

    heart.innerHTML = '❤';

    heart.style.left =
    Math.random()*100 + 'vw';

    heart.style.top =
    '100vh';

    heart.style.fontSize =
    (
        15 +
        Math.random()*30
    ) + 'px';

    heart.style.animationDuration =
    (
        4 +
        Math.random()*5
    ) + 's';

    document.body.appendChild(
        heart
    );
}

</script>

</body>
</html>
