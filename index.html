<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY QUEEN ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at center,
    #240010 0%,
    #120008 45%,
    #000 100%);
    font-family:Arial,sans-serif;
}

/* ========================= */
/* BIOMETRIC SCAN */
/* ========================= */

#scanScreen{
    position:fixed;
    inset:0;
    background:black;
    z-index:9999;
    overflow:hidden;
}

/* camera glow */

.cameraGlow{
    position:absolute;
    width:700px;
    height:700px;
    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(255,0,120,0.15),
    transparent 70%);

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    filter:blur(60px);

    animation:pulse 3s infinite alternate;
}

@keyframes pulse{

    from{
        transform:
        translate(-50%,-50%)
        scale(1);

        opacity:0.5;
    }

    to{
        transform:
        translate(-50%,-50%)
        scale(1.15);

        opacity:1;
    }
}

/* face cards */

.faceBox{
    position:absolute;

    width:250px;
    height:320px;

    top:50%;

    transform:translateY(-50%);

    border-radius:30px;

    overflow:hidden;

    border:
    2px solid rgba(255,255,255,0.15);

    box-shadow:
    0 0 30px rgba(255,0,120,0.25);
}

.leftBox{
    left:10%;
}

.rightBox{
    right:10%;
}

.face{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* biometric corners */

.corner{
    position:absolute;
    width:40px;
    height:40px;
    border:4px solid hotpink;
}

.tl{
    top:10px;
    left:10px;
    border-right:none;
    border-bottom:none;
}

.tr{
    top:10px;
    right:10px;
    border-left:none;
    border-bottom:none;
}

.bl{
    bottom:10px;
    left:10px;
    border-right:none;
    border-top:none;
}

.br{
    bottom:10px;
    right:10px;
    border-left:none;
    border-top:none;
}

/* scan line */

.scanLine{
    position:absolute;
    width:100%;
    height:5px;

    background:
    linear-gradient(
    90deg,
    transparent,
    hotpink,
    white,
    hotpink,
    transparent);

    box-shadow:
    0 0 25px hotpink,
    0 0 50px deeppink;

    animation:scanMove 2.5s linear infinite;
}

@keyframes scanMove{

    from{
        top:0;
    }

    to{
        top:100%;
    }
}

/* face mesh */

.mesh{
    position:absolute;
    inset:0;

    background-image:
    radial-gradient(
    rgba(255,105,180,0.8) 1px,
    transparent 1px);

    background-size:24px 24px;

    opacity:0.35;

    animation:rotateMesh 10s linear infinite;
}

@keyframes rotateMesh{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* center biometric ring */

.ring{
    position:absolute;

    width:180px;
    height:180px;

    border-radius:50%;

    border:3px solid hotpink;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    box-shadow:
    0 0 20px hotpink,
    inset 0 0 20px hotpink;

    animation:ringPulse 1.8s infinite;
}

@keyframes ringPulse{

    0%{
        transform:
        translate(-50%,-50%)
        scale(1);

        opacity:1;
    }

    100%{
        transform:
        translate(-50%,-50%)
        scale(1.3);

        opacity:0;
    }
}

/* status */

.scanText{
    position:absolute;

    bottom:10%;

    width:100%;

    text-align:center;

    color:white;

    font-size:30px;

    letter-spacing:5px;

    text-shadow:
    0 0 10px pink,
    0 0 20px deeppink;

    animation:blink 1s infinite;
}

@keyframes blink{

    50%{
        opacity:0.4;
    }
}

/* ========================= */
/* MAIN */
/* ========================= */

.bgGlow{
    position:fixed;
    width:700px;
    height:700px;
    border-radius:50%;
    background:rgba(255,120,180,0.1);
    filter:blur(120px);
}

.container{
    position:relative;
}

canvas{
    background:white;

    border-radius:25px;

    max-width:92vw;
    max-height:88vh;

    box-shadow:
    0 0 25px rgba(255,255,255,0.2),
    0 0 80px rgba(255,120,180,0.25);
}

/* brush hand */

#hand{
    position:absolute;
    width:170px;
    z-index:5;
    pointer-events:none;

    filter:
    drop-shadow(0 0 15px rgba(0,0,0,0.5))
    drop-shadow(0 0 25px rgba(255,120,180,0.4));

    transition:all 0.03s linear;
}

/* romantic text */

.title{
    position:absolute;
    width:100%;
    bottom:-95px;

    text-align:center;

    color:white;

    font-size:24px;

    line-height:1.7;

    letter-spacing:3px;

    animation:glow 2s infinite alternate;
}

@keyframes glow{

    from{
        opacity:0.7;
        text-shadow:0 0 5px pink;
    }

    to{
        opacity:1;

        text-shadow:
        0 0 10px pink,
        0 0 20px hotpink,
        0 0 40px deeppink;
    }
}

</style>
</head>
<body>

<!-- ========================= -->
<!-- BIOMETRIC SCAN -->
<!-- ========================= -->

<div id="scanScreen">

    <div class="cameraGlow"></div>

    <!-- YOUR FACE -->

    <div class="faceBox leftBox">

        <img src="me.jpg" class="face">

        <div class="mesh"></div>

        <div class="scanLine"></div>

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

    </div>

    <!-- HER FACE -->

    <div class="faceBox rightBox">

        <img src="her.jpg" class="face">

        <div class="mesh"></div>

        <div class="scanLine"></div>

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

    </div>

    <!-- center -->

    <div class="ring"></div>

    <div class="scanText">
        BIOMETRIC LOVE MATCH ❤️
    </div>

</div>

<!-- ========================= -->
<!-- MAIN -->
<!-- ========================= -->

<div class="bgGlow"></div>

<div class="container">

    <canvas id="canvas"></canvas>

    <!-- paint brush -->

    <img id="hand"
    src="https://pngimg.com/d/paint_brush_PNG24.png">

    <div class="title">
        MY QUEEN ❤️
    </div>

</div>

<script>

/* ========================= */
/* MUSIC */
/* ========================= */

const audioCtx =
new (window.AudioContext ||
window.webkitAudioContext)();

function tone(freq,time,duration){

    const osc =
    audioCtx.createOscillator();

    const gain =
    audioCtx.createGain();

    osc.type = 'sine';

    osc.frequency.value = freq;

    gain.gain.setValueAtTime(
        0,
        audioCtx.currentTime
    );

    gain.gain.linearRampToValueAtTime(
        0.04,
        audioCtx.currentTime + 0.1
    );

    gain.gain.linearRampToValueAtTime(
        0,
        audioCtx.currentTime + duration
    );

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start(time);

    osc.stop(time + duration);
}

function music(){

    const notes = [
        261.63,
        329.63,
        392.00,
        523.25,
        392.00,
        329.63
    ];

    let t = audioCtx.currentTime;

    notes.forEach((n,i)=>{

        tone(
            n,
            t + i*0.45,
            0.8
        );
    });

    setTimeout(music,3500);
}

document.body.addEventListener(
'click',
()=>{
    audioCtx.resume();
    music();
},{
    once:true
});

/* ========================= */
/* DRAWING */
/* ========================= */

const canvas =
document.getElementById('canvas');

const ctx =
canvas.getContext('2d');

const hand =
document.getElementById('hand');

const title =
document.querySelector('.title');

const img = new Image();

img.src = 'photo.jpg';

function startDrawing(){

    img.onload = ()=>{

        canvas.width = img.width;
        canvas.height = img.height;

        ctx.fillStyle = 'white';

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        // hidden image

        const hidden =
        document.createElement('canvas');

        hidden.width = img.width;
        hidden.height = img.height;

        const hctx =
        hidden.getContext('2d');

        hctx.drawImage(img,0,0);

        const pixels =
        hctx.getImageData(
            0,
            0,
            img.width,
            img.height
        ).data;

        let points = [];

        for(let y=0;y<img.height;y+=2){

            for(let x=0;x<img.width;x+=2){

                const i =
                (y*img.width + x)*4;

                const r = pixels[i];
                const g = pixels[i+1];
                const b = pixels[i+2];

                const gray =
                (r+g+b)/3;

                if(gray < 250){

                    points.push({
                        x,
                        y
                    });
                }
            }
        }

        points.sort(()=>Math.random()-0.5);

        let index = 0;

        function animate(){

            for(let s=0;s<150;s++){

                if(index >= points.length){

                    title.innerHTML =
                    `
                    You are my queen ❤️<br>
                    My forever happiness ❤️
                    `;

                    return;
                }

                const p = points[index];

                const i =
                (p.y*img.width+p.x)*4;

                const r = pixels[i];
                const g = pixels[i+1];
                const b = pixels[i+2];

                // realistic paint stroke

                ctx.beginPath();

                ctx.strokeStyle =
                `rgba(${r},${g},${b},0.85)`;

                ctx.lineWidth =
                Math.random()*4+1;

                ctx.lineCap='round';

                ctx.shadowColor =
                `rgba(${r},${g},${b},0.5)`;

                ctx.shadowBlur = 8;

                ctx.moveTo(
                    p.x,
                    p.y
                );

                ctx.lineTo(
                    p.x + Math.random()*6,
                    p.y + Math.random()*4
                );

                ctx.stroke();

                // hand move

                hand.style.left =
                (canvas.offsetLeft + p.x - 60)
                + 'px';

                hand.style.top =
                (canvas.offsetTop + p.y - 40)
                + 'px';

                hand.style.transform =
                `rotate(${
                    10 + Math.sin(index/20)*6
                }deg)`;

                index++;
            }

            requestAnimationFrame(animate);
        }

        animate();
    };

    if(img.complete){
        img.onload();
    }
}

/* start after scan */

setTimeout(()=>{

    document
    .getElementById('scanScreen')
    .remove();

    startDrawing();

},5000);

</script>

</body>
    </html>
