<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>💖 ROYAL REVELATION | MY QUEEN</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at center, #0a0a0a, #000000);
        font-family: 'Segoe UI', 'Poppins', 'Arial', system-ui, sans-serif;
        position: relative;
    }

    /* CinemaScope bars with soft glow */
    .bar {
        position: fixed;
        width: 100%;
        height: 85px;
        background: linear-gradient(180deg, #000000 0%, #0b0b0b 100%);
        z-index: 9999;
        box-shadow: 0 0 20px rgba(255, 20, 147, 0.3);
    }
    .top {
        top: 0;
        border-bottom: 1px solid rgba(255, 105, 180, 0.5);
    }
    .bottom {
        bottom: 0;
        border-top: 1px solid rgba(255, 105, 180, 0.5);
    }

    /* scanning intro screen — cinematic */
    #scanScreen {
        position: fixed;
        inset: 0;
        background: #000000ee;
        backdrop-filter: blur(5px);
        z-index: 9998;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        animation: pulseGlow 1.4s infinite ease-in-out;
    }
    .scanText {
        margin-bottom: 130px;
        color: #ff66cc;
        font-size: 1.35rem;
        letter-spacing: 5px;
        font-weight: 300;
        text-transform: uppercase;
        background: rgba(0,0,0,0.6);
        padding: 12px 24px;
        border-radius: 60px;
        backdrop-filter: blur(8px);
        border: 1px solid #ff69b4;
        font-family: monospace;
        box-shadow: 0 0 25px rgba(255,20,147,0.6);
        text-shadow: 0 0 6px hotpink;
    }
    @keyframes pulseGlow {
        0% { opacity: 0.95; backdrop-filter: blur(4px);}
        100% { opacity: 1; backdrop-filter: blur(7px);}
    }

    /* canvas elegant rounded frame */
    canvas {
        background: #111;
        border-radius: 32px;
        max-width: 92vw;
        max-height: 85vh;
        width: auto;
        height: auto;
        box-shadow: 0 0 65px rgba(255, 20, 147, 0.5), 0 20px 40px rgba(0,0,0,0.6);
        transition: all 0.4s ease;
        border: 2px solid rgba(255,192,203,0.3);
        cursor: crosshair;
    }

    /* magic brush hand - royal painter */
    #hand {
        position: absolute;
        width: 170px;
        pointer-events: none;
        z-index: 100;
        filter: drop-shadow(0 0 18px #ff66cc) drop-shadow(0 4px 12px black);
        transition: opacity 0.6s ease;
        will-change: transform, left, top;
    }

    /* title with royal accent */
    .title {
        position: absolute;
        bottom: 35px;
        width: 100%;
        text-align: center;
        color: rgba(255,245,240,0.95);
        font-size: 1.8rem;
        font-weight: 500;
        letter-spacing: 3px;
        text-shadow: 0 0 10px hotpink, 0 2px 5px black;
        z-index: 9997;
        background: linear-gradient(135deg, #ffb6c1, #ff69b4);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        backdrop-filter: blur(3px);
        font-family: 'Georgia', serif;
        transition: all 0.5s;
    }

    /* kiss explosion */
    #kiss {
        position: fixed;
        inset: 0;
        display: none;
        justify-content: center;
        align-items: center;
        font-size: 160px;
        z-index: 10001;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0.7), #000000c9);
        backdrop-filter: blur(15px);
        animation: kissPop 0.8s cubic-bezier(0.2, 1.2, 0.3, 1);
        pointer-events: none;
        text-shadow: 0 0 35px #ff1493, 0 0 20px white;
    }
    @keyframes kissPop {
        0% { opacity: 0; transform: scale(0.7); backdrop-filter: blur(5px);}
        40% { opacity: 1; transform: scale(1.1);}
        100% { opacity: 0; transform: scale(1.4); backdrop-filter: blur(20px);}
    }

    /* subtle sparkle overlay */
    .spark {
        position: fixed;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9996;
        background: radial-gradient(circle at 20% 40%, rgba(255,105,180,0.05), transparent 80%);
    }

    @media (max-width: 700px) {
        .title { font-size: 1.2rem; bottom: 20px; letter-spacing: 1px; }
        #hand { width: 120px; }
        .scanText { font-size: 0.9rem; margin-bottom: 90px; letter-spacing: 2px; }
        .bar { height: 50px; }
        canvas { max-height: 78vh; border-radius: 24px; }
    }

    .instruction-tip {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffb7c5;
        font-size: 0.7rem;
        background: rgba(0,0,0,0.5);
        padding: 6px 16px;
        border-radius: 50px;
        z-index: 9995;
        font-family: monospace;
        letter-spacing: 1px;
        backdrop-filter: blur(4px);
        white-space: nowrap;
        pointer-events: none;
    }
</style>
</head>
<body>

<div class="bar top"></div>
<div class="bar bottom"></div>
<div class="spark"></div>

<div id="scanScreen">
    <div class="scanText">✨ AI SCANNING · REVEALING DIVINE PRESENCE ✨</div>
</div>

<div id="kiss">💋💖</div>

<canvas id="canvas"></canvas>
<img id="hand" src="https://pngimg.com/d/paint_brush_PNG24.png" alt="magic brush">
<div class="title">👑 MY QUEEN · SECRET GODDESS 👑</div>
<div class="instruction-tip">✨ ROYAL BRUSH REVEALS HER GLOW ✨</div>

<script>
    (function(){
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const handIcon = document.getElementById("hand");
        const kissDiv = document.getElementById("kiss");
        const titleDiv = document.querySelector(".title");

        // ---------- HIGH QUALITY PHOTO (built-in romantic portrait, secret goddess) ----------
        // Using a stunning, elegant high-res portrait that feels like "MY QUEEN".
        // This image is royalty-free, artistic & beautiful — represents secret goddess vibe.
        const img = new Image();
        // Premium quality dreamy portrait with soft glow (elegant woman in golden hour)
        img.src = "https://images.pexels.com/photos/3812743/pexels-photo-3812743.jpeg?auto=compress&cs=tinysrgb&w=1200&h=1600&fit=crop";
        // Alternative fallback: if cross-origin or blocked? but it's public pexels CORS friendly.
        // But we also have a SECONDARY backup dynamic detection if needed, but this is reliable.
        // In case the image fails to load due to network, we embed a beautiful DataURL backup portrait (classic queen artwork)
        // This ensures the experience never breaks.
        
        let pixels = null;
        let animationActive = true;
        let drawingFinished = false;
        
        // Backup masterpiece (Generated classic beauty with warm tone – just in case)
        const backupImageURL = "https://images.pexels.com/photos/4519057/pexels-photo-4519057.jpeg?auto=compress&cs=tinysrgb&w=1000&h=1400&fit=crop";
        
        let mainImageUsed = null;
        
        // function to handle image load with fallback
        function setupImage(primaryUrl, fallbackUrl) {
            let attempt = 0;
            const loadImg = (url) => {
                const tempImg = new Image();
                tempImg.crossOrigin = "Anonymous";
                tempImg.onload = () => {
                    img.src = url;
                    mainImageUsed = url;
                    startProcess();
                };
                tempImg.onerror = () => {
                    if(attempt === 0) {
                        attempt++;
                        loadImg(fallbackUrl);
                    } else {
                        // ultimate fallback: create canvas generated art? just to avoid white: use stylized text? but never fails.
                        console.warn("using decorative fallback");
                        generateEmergencyPortrait();
                    }
                };
                tempImg.src = url;
            };
            loadImg(primaryUrl);
        }
        
        function generateEmergencyPortrait() {
            // create a graceful artistic portrait on canvas directly: a silhouette goddess with roses
            const offCanvas = document.createElement('canvas');
            offCanvas.width = 800;
            offCanvas.height = 1000;
            const offCtx = offCanvas.getContext('2d');
            offCtx.fillStyle = "#ffe4ec";
            offCtx.fillRect(0,0,800,1000);
            offCtx.globalCompositeOperation = "source-over";
            // elegant face profile
            offCtx.fillStyle = "#f3c6ad";
            offCtx.beginPath();
            offCtx.ellipse(400, 400, 140, 180, 0, 0, Math.PI*2);
            offCtx.fill();
            offCtx.fillStyle = "#e0ac77";
            offCtx.beginPath();
            offCtx.ellipse(400, 440, 100, 110, 0, 0, Math.PI*2);
            offCtx.fill();
            offCtx.fillStyle = "#8b5a2b";
            offCtx.beginPath();
            offCtx.arc(360, 380, 12, 0, Math.PI*2);
            offCtx.arc(440, 380, 12, 0, Math.PI*2);
            offCtx.fill();
            offCtx.fillStyle = "#d43f6b";
            offCtx.beginPath();
            offCtx.ellipse(400, 450, 35, 22, 0, 0, Math.PI*2);
            offCtx.fill();
            offCtx.fillStyle = "#ffc0cb";
            offCtx.beginPath();
            offCtx.moveTo(320,320);
            offCtx.quadraticCurveTo(400,280,480,320);
            offCtx.fill();
            offCtx.fillStyle = "gold";
            offCtx.font = "bold 42px 'Segoe UI'";
            offCtx.fillText("✨QUEEN✨", 300, 700);
            offCtx.fillStyle = "#ff69b4";
            offCtx.font = "24px monospace";
            offCtx.fillText("eternal muse", 330, 820);
            const dataURL = offCanvas.toDataURL();
            img.src = dataURL;
            startProcess();
        }
        
        function startProcess() {
            if(!img.complete) {
                img.onload = () => {
                    initDrawing();
                };
                if(img.complete) initDrawing();
            } else {
                initDrawing();
            }
        }
        
        function initDrawing() {
            canvas.width = img.width;
            canvas.height = img.height;
            
            // initial white canvas for brush stroke reveal
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.shadowBlur = 0;
            
            // hidden canvas to extract pixel data safely (CORS friendly - our images are crossOrigin)
            const hiddenCanvas = document.createElement("canvas");
            hiddenCanvas.width = img.width;
            hiddenCanvas.height = img.height;
            const hiddenCtx = hiddenCanvas.getContext("2d");
            hiddenCtx.drawImage(img, 0, 0, img.width, img.height);
            const imageData = hiddenCtx.getImageData(0, 0, img.width, img.height);
            pixels = imageData.data;
            
            drawWithMagicBrush();
        }
        
        // majestic drawing engine
        let currentX = 0;
        let currentY = 0;
        let stepSize = 2;    // smooth resolution
        let framePending = false;
        
        function drawWithMagicBrush() {
            if(drawingFinished) return;
            
            const totalSteps = 1800;   // dynamic performance
            let drawn = 0;
            
            function scanStroke() {
                if(drawingFinished) return;
                for(let iter = 0; iter < 950; iter++) {
                    if(currentY >= img.height) {
                        finishRevelation();
                        return;
                    }
                    
                    const idx = (currentY * img.width + currentX) * 4;
                    if(idx >= 0 && idx + 3 < pixels.length) {
                        const r = pixels[idx];
                        const g = pixels[idx+1];
                        const b = pixels[idx+2];
                        const brightness = (r + g + b) / 3;
                        
                        // intelligent background removal with soft edge detection 
                        // enhanced filter: pure white/offwhite/greyish backgrounds (photo booth style)
                        const isNearWhite = (r > 235 && g > 235 && b > 235);
                        const isSaturatedBg = (Math.abs(r-g) < 14 && Math.abs(g-b) < 14 && brightness > 210);
                        const isVeryLight = brightness > 240;
                        
                        // KEEP ONLY SUBJECT (queen essence)
                        const isBackground = (isNearWhite || isSaturatedBg || isVeryLight);
                        
                        if(!isBackground) {
                            // draw romantic line strokes with organic texture & glow
                            ctx.beginPath();
                            const alphaVal = 0.82;
                            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alphaVal})`;
                            ctx.lineWidth = 1.6;
                            ctx.lineCap = "round";
                            ctx.lineJoin = "round";
                            ctx.shadowBlur = 2.5;
                            ctx.shadowColor = "rgba(0,0,0,0.2)";
                            ctx.moveTo(currentX, currentY);
                            ctx.lineTo(currentX + 1.2, currentY + 1.2);
                            ctx.stroke();
                            
                            // dynamic hand movement (smooth brush following the queen's contour)
                            if(handIcon) {
                                const rect = canvas.getBoundingClientRect();
                                const scaleX = canvas.width / rect.width;
                                const scaleY = canvas.height / rect.height;
                                // map canvas coordinate to screen
                                const screenX = rect.left + (currentX / scaleX);
                                const screenY = rect.top + (currentY / scaleY);
                                handIcon.style.left = (screenX - 55) + "px";
                                handIcon.style.top = (screenY - 45) + "px";
                                // gentle wavy rotation like an artist's flourish
                                const rotation = Math.sin(currentX / 28) * 4 + Math.cos(currentY / 28) * 2;
                                handIcon.style.transform = `rotate(${rotation}deg)`;
                                handIcon.style.opacity = "0.95";
                            }
                        }
                    }
                    
                    // move position
                    currentX += stepSize;
                    if(currentX >= img.width) {
                        currentX = 0;
                        currentY += stepSize;
                    }
                    if(currentY >= img.height) {
                        finishRevelation();
                        return;
                    }
                    drawn++;
                }
                requestAnimationFrame(scanStroke);
            }
            
            scanStroke();
        }
        
        function finishRevelation() {
            if(drawingFinished) return;
            drawingFinished = true;
            animationActive = false;
            
            // Hide brush gracefully
            if(handIcon) {
                handIcon.style.transition = "opacity 0.7s ease";
                handIcon.style.opacity = "0";
            }
            
            // cinematic fade in: original image overlays with romantic transition
            let fadeAlpha = 0;
            function fadeOriginalImage() {
                fadeAlpha += 0.022;
                ctx.globalAlpha = Math.min(fadeAlpha, 1);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                if(fadeAlpha < 1) {
                    requestAnimationFrame(fadeOriginalImage);
                } else {
                    ctx.globalAlpha = 1;
                    // Final glorious message + kiss explosion
                    if(kissDiv) {
                        kissDiv.style.display = "flex";
                        setTimeout(() => {
                            kissDiv.style.display = "none";
                            if(titleDiv) {
                                titleDiv.innerHTML = "💋 MY QUEEN · REVEALED FOREVER 💋";
                                titleDiv.style.background = "linear-gradient(135deg, #ff99cc, #ff3399)";
                                titleDiv.style.webkitBackgroundClip = "text";
                                titleDiv.style.backgroundClip = "text";
                                titleDiv.style.color = "transparent";
                                titleDiv.style.fontSize = "2rem";
                            }
                            // extra sparkles: add floating hearts
                            createFloatingHearts();
                        }, 1400);
                    } else {
                        if(titleDiv) titleDiv.innerHTML = "❤️ ROYAL PRESENCE UNVEILED ❤️";
                    }
                }
            }
            fadeOriginalImage();
        }
        
        function createFloatingHearts() {
            const heartContainer = document.createElement('div');
            heartContainer.style.position = 'fixed';
            heartContainer.style.inset = '0';
            heartContainer.style.pointerEvents = 'none';
            heartContainer.style.zIndex = '10002';
            heartContainer.style.overflow = 'hidden';
            document.body.appendChild(heartContainer);
            for(let i=0;i<45;i++) {
                const heart = document.createElement('div');
                heart.innerHTML = ['💖','💗','💓','💕','💘','👑','✨'][Math.floor(Math.random()*7)];
                heart.style.position = 'absolute';
                heart.style.fontSize = (20+Math.random()*45)+'px';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.bottom = '-40px';
                heart.style.opacity = 0.8;
                heart.style.animation = `floatHeart ${2+Math.random()*4}s linear forwards`;
                heart.style.filter = 'drop-shadow(0 0 6px hotpink)';
                heartContainer.appendChild(heart);
                
                const keyframes = `
                    @keyframes floatHeart {
                        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
                        100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
                    }
                `;
                if(!document.querySelector('#dynamicHeartKeyframe')) {
                    const styleSheet = document.createElement('style');
                    styleSheet.id = 'dynamicHeartKeyframe';
                    styleSheet.textContent = keyframes;
                    document.head.appendChild(styleSheet);
                }
                heart.style.animationName = 'floatHeart';
            }
            setTimeout(() => {
                heartContainer.remove();
            }, 5000);
        }
        
        // start scanning sequence with intro delay
        setTimeout(() => {
            const scanDiv = document.getElementById("scanScreen");
            if(scanDiv) {
                scanDiv.style.transition = "opacity 0.9s ease";
                scanDiv.style.opacity = "0";
                setTimeout(() => {
                    if(scanDiv) scanDiv.remove();
                }, 1000);
            }
            // load magnificent image with backup royalty-free portrait (elegant queen)
            setupImage(img.src, backupImageURL);
        }, 3800);
        
        // Add window resize to reposition hand appropriately (but not critical)
        window.addEventListener('resize', () => {
            if(!drawingFinished && handIcon && canvas && currentX && currentY) {
                const rect = canvas.getBoundingClientRect();
                if(rect && rect.width > 0) {
                    const scaleX = canvas.width / rect.width;
                    const screenX = rect.left + (currentX / scaleX);
                    const screenY = rect.top + (currentY / (canvas.height / rect.height));
                    handIcon.style.left = (screenX - 55) + "px";
                    handIcon.style.top = (screenY - 45) + "px";
                }
            }
        });
        
        // preload style for floating hearts dynamic 
        const styleFloat = document.createElement('style');
        styleFloat.textContent = `
            @keyframes glowTitle {
                0% { text-shadow: 0 0 2px hotpink; }
                100% { text-shadow: 0 0 15px #ff66cc; }
            }
            .title {
                animation: glowTitle 1.8s infinite alternate;
            }
        `;
        document.head.appendChild(styleFloat);
        
        // ensure initial hand visibility
        if(handIcon) handIcon.style.opacity = "1";
        
        // extra effect: a gentle background audio? no automatic but visual.
        console.log("👑 MY QUEEN | SECRET GODDESS REVELATION READY");
    })();
</script>
</body>
    </html>
