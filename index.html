<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY QUEEN ❤️ SECRET GOD</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    font-family:Arial;
}

/* CINEMA BARS */
.bar{
    position:fixed;
    width:100%;
    height:90px;
    background:black;
    z-index:9999;
}
.top{top:0;}
.bottom{bottom:0;}

/* SCAN SCREEN */
#scanScreen{
    position:fixed;
    inset:0;
    background:black;
    z-index:9998;
}

.scanText{
    position:absolute;
    bottom:12%;
    width:100%;
    text-align:center;
    color:hotpink;
    font-size:20px;
    letter-spacing:3px;
}

/* MAIN CANVAS */
canvas{
    background:white;
    border-radius:18px;
    max-width:92vw;
    max-height:88vh;
    box-shadow:0 0 140px rgba(255,0,120,0.25);
}

#hand{
    position:absolute;
    width:210px;
    pointer-events:none;
    z-index:10;
    filter:drop-shadow(0 0 25px hotpink);
    transition:0.03s;
}

.title{
    position:absolute;
    bottom:-80px;
    width:100%;
    text-align:center;
    color:white;
    font-size:22px;
    letter-spacing:2px;
}

/* KISS OVERLAY */
#kiss{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    font-size:120px;
    z-index:10000;
    animation:pop 1s ease-in-out;
}

@keyframes pop{
    from{transform:scale(0);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

</style>
</head>

<body>

<div class="bar top"></div>
<div class="bar bottom"></div>

<div id="scanScreen">
    <div class="scanText">AI LOVE SCAN... INITIALIZING HEART LINK ❤️</div>
</div>

<div id="kiss">💋</div>

<canvas id="canvas"></canvas>

<img id="hand"
src="https://pngimg.com/d/paint_brush_PNG24.png">

<div class="title">MY QUEEN ❤️</div>

<script>

/* ================= AUDIO ENGINE ================= */

const audioCtx = new (window.AudioContext||window.webkitAudioContext)();

function heart(){
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type="sine";
    o.frequency.value=55;
    g.gain.value=0.2;
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+0.2);
}

function pencil(){
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type="triangle";
    o.frequency.value=900+Math.random()*300;
    g.gain.value=0.02;
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+0.03);
}

setInterval(()=>heart(),850);

/* ================= PARTICLES ================= */

function particle(){
    const p=document.createElement("div");
    p.style.position="fixed";
    p.style.width="6px";
    p.style.height="6px";
    p.style.background="hotpink";
    p.style.borderRadius="50%";
    p.style.left=Math.random()*innerWidth+"px";
    p.style.top=innerHeight+"px";
    p.style.opacity=0.6;
    document.body.appendChild(p);

    let y=innerHeight;

    const move=setInterval(()=>{
        y-=2;
        p.style.top=y+"px";
        if(y<-20){clearInterval(move);p.remove();}
    },16);
}

setInterval(particle,260);

/* ================= MAIN ================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const hand=document.getElementById("hand");
const title=document.querySelector(".title");
const kiss=document.getElementById("kiss");

const img=new Image();
img.src="photo.jpg";

let pixels;

/* ================= START ================= */

function start(){

img.onload=()=>{

canvas.width=img.width;
canvas.height=img.height;

ctx.fillStyle="white";
ctx.fillRect(0,0,canvas.width,canvas.height);

const h=document.createElement("canvas");
h.width=img.width;
h.height=img.height;

const hctx=h.getContext("2d");
hctx.drawImage(img,0,0);

pixels=hctx.getImageData(0,0,img.width,img.height).data;

draw();
};

if(img.complete)img.onload();
}

/* ================= GOD DRAW ================= */

function draw(){

const cx=img.width/2;
const cy=img.height/2.2;

let r=1;
let phase=0;

setTimeout(()=>phase=1,1200);

function loop(){

if(r>Math.max(img.width,img.height)){
    finish();
    return;
}

for(let a=0;a<360;a+=1.1){

const rad=a*Math.PI/180;

const x=Math.floor(cx+Math.cos(rad)*r);
const y=Math.floor(cy+Math.sin(rad)*r);

if(x<0||y<0||x>=img.width||y>=img.height)continue;

const i=(y*img.width+x)*4;

const R=pixels[i],G=pixels[i+1],B=pixels[i+2],A=pixels[i+3];

const br=(R+G+B)/3;

if(br<250&&A>0){

pencil();

/* sketch */
if(phase===0){
ctx.fillStyle="rgba(255,255,255,0.05)";
ctx.fillRect(x,y,1,1);
}

/* color */
if(phase===1){
ctx.beginPath();
ctx.strokeStyle=`rgba(${R},${G},${B},0.95)`;
ctx.lineWidth=3;
ctx.lineCap="round";
ctx.shadowBlur=15;
ctx.shadowColor=`rgba(${R},${G},${B},0.4)`;
ctx.moveTo(x,y);
ctx.lineTo(x+3,y+2);
ctx.stroke();
}

hand.style.left=(canvas.offsetLeft+x-85)+"px";
hand.style.top=(canvas.offsetTop+y-65)+"px";
hand.style.transform=`rotate(${Math.sin(r/10)*8}deg)`;
}
}

r+=2.2;

requestAnimationFrame(loop);
}

loop();
}

/* ================= FINAL SECRET MOMENT ================= */

function finish(){

let a=0;
let zoom=1.35;

function anim(){

a+=0.015;
zoom-=0.0035;

ctx.save();
ctx.globalAlpha=a;
ctx.setTransform(1,0,0,1,0,0);
ctx.scale(zoom,zoom);
ctx.drawImage(img,0,0);
ctx.restore();

if(a<1){
requestAnimationFrame(anim);
}else{

hand.style.opacity="0";

/* kiss + message */
kiss.style.display="flex";

setTimeout(()=>{
kiss.style.display="none";
title.innerHTML=
"💖 I CHOOSE YOU ❤️<br>FOREVER AND ALWAYS 👑";
},1200);
}

}

anim();
}

/* START */

document.body.addEventListener("click",()=>{
audioCtx.resume();
},{once:true});

setTimeout(()=>{
document.getElementById("scanScreen").remove();
start();
},4000);

</script>

</body>
</html>
