<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY QUEEN ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at center,
    #2a0012 0%,
    #120008 45%,
    #000 100%);

    font-family:Arial,sans-serif;
}

/* SCAN SCREEN */

#scanScreen{
    position:fixed;
    inset:0;
    background:black;
    z-index:9999;
}

.cameraGlow{
    position:absolute;
    width:800px;
    height:800px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,0,120,0.2), transparent 70%);
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    filter:blur(70px);
    animation:pulse 3s infinite alternate;
}

@keyframes pulse{
    from{transform:translate(-50%,-50%) scale(1);opacity:0.5;}
    to{transform:translate(-50%,-50%) scale(1.2);opacity:1;}
}

.faceBox{
    position:absolute;
    width:240px;
    height:320px;
    top:50%;
    transform:translateY(-50%);
    border-radius:30px;
    overflow:hidden;
    border:2px solid rgba(255,255,255,0.2);
}

.leftBox{left:8%;}
.rightBox{right:8%;}

.face{
    width:100%;
    height:100%;
    object-fit:cover;
}

.scanLine{
    position:absolute;
    width:100%;
    height:5px;
    background:linear-gradient(90deg,transparent,hotpink,white,hotpink,transparent);
    box-shadow:0 0 25px hotpink;
    animation:scanMove 2s linear infinite;
}

@keyframes scanMove{
    from{top:0;}
    to{top:100%;}
}

.ring{
    position:absolute;
    width:180px;height:180px;
    border-radius:50%;
    border:3px solid hotpink;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    animation:ringPulse 2s infinite;
}

@keyframes ringPulse{
    0%{transform:translate(-50%,-50%) scale(1);opacity:1;}
    100%{transform:translate(-50%,-50%) scale(1.4);opacity:0;}
}

.scanText{
    position:absolute;
    bottom:10%;
    width:100%;
    text-align:center;
    color:white;
    font-size:30px;
    letter-spacing:5px;
}

/* MAIN */

canvas{
    background:white;
    border-radius:25px;
    max-width:92vw;
    max-height:88vh;
    box-shadow:0 0 80px rgba(255,0,120,0.3);
}

#hand{
    position:absolute;
    width:200px;
    pointer-events:none;
    z-index:5;
    transition:0.03s;
}

.title{
    position:absolute;
    bottom:-90px;
    width:100%;
    text-align:center;
    color:white;
    font-size:24px;
    letter-spacing:3px;
}

</style>
</head>

<body>

<div id="scanScreen">
    <div class="cameraGlow"></div>

    <div class="faceBox leftBox">
        <img src="me.jpg" class="face">
        <div class="scanLine"></div>
    </div>

    <div class="faceBox rightBox">
        <img src="her.jpg" class="face">
        <div class="scanLine"></div>
    </div>

    <div class="ring"></div>

    <div class="scanText">BIOMETRIC LOVE MATCH ❤️</div>
</div>

<canvas id="canvas"></canvas>

<img id="hand"
src="https://pngimg.com/d/paint_brush_PNG24.png">

<div class="title">MY QUEEN ❤️</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const hand = document.getElementById("hand");
const title = document.querySelector(".title");

const img = new Image();
img.src = "photo.jpg";

let pixels;

function startDrawing(){

img.onload = ()=>{

    canvas.width = img.width;
    canvas.height = img.height;

    ctx.fillStyle="white";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const hidden = document.createElement("canvas");
    hidden.width = img.width;
    hidden.height = img.height;

    const hctx = hidden.getContext("2d");
    hctx.drawImage(img,0,0);

    pixels = hctx.getImageData(0,0,img.width,img.height).data;

    drawFromFace();
};

if(img.complete) img.onload();
}

/* ===================== */
/* START FROM FACE */
/* ===================== */

function drawFromFace(){

const cx = img.width/2;
const cy = img.height/2.3;

let r = 1;

function loop(){

if(r > Math.max(img.width,img.height)){
    revealFinal();
    return;
}

for(let a=0;a<360;a+=2){

    const rad = a*Math.PI/180;

    const x = Math.floor(cx + Math.cos(rad)*r);
    const y = Math.floor(cy + Math.sin(rad)*r);

    if(x<0||y<0||x>=img.width||y>=img.height) continue;

    const i = (y*img.width+x)*4;

    const R = pixels[i];
    const G = pixels[i+1];
    const B = pixels[i+2];
    const A = pixels[i+3];

    const br = (R+G+B)/3;

    if(br < 250 && A>0){

        ctx.beginPath();

        ctx.strokeStyle = `rgba(${R},${G},${B},0.95)`;

        ctx.lineWidth = 6;

        ctx.lineCap = "round";

        ctx.shadowBlur = 10;

        ctx.shadowColor = `rgba(${R},${G},${B},0.6)`;

        ctx.moveTo(x,y);
        ctx.lineTo(x+10,y+3);
        ctx.stroke();

        hand.style.left = (canvas.offsetLeft + x - 90) + "px";
        hand.style.top = (canvas.offsetTop + y - 70) + "px";
    }
}

r += 3;

requestAnimationFrame(loop);

}

loop();
}

/* ===================== */
/* FINAL REVEAL */
/* ===================== */

function revealFinal(){

let a = 0;

function fade(){

a += 0.03;

ctx.globalAlpha = a;
ctx.drawImage(img,0,0);

if(a < 1){
requestAnimationFrame(fade);
}
else{
hand.style.opacity="0";
title.innerHTML="✨ MY QUEEN ❤️ ✨<br>Forever Love ❤️";
}

}

fade();
}

/* START AFTER SCAN */

setTimeout(()=>{
document.getElementById("scanScreen").remove();
startDrawing();
},5000);

</script>

</body>
</html>
