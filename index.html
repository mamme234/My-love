<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY QUEEN ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at center,
    #2b0f18 0%,
    #12060d 40%,
    #000 100%);
    font-family:Arial,sans-serif;
}

/* Romantic Glow */

.bgGlow{
    position:fixed;
    width:700px;
    height:700px;
    border-radius:50%;
    background:rgba(255,120,180,0.12);
    filter:blur(120px);
    animation:pulse 4s infinite alternate;
}

@keyframes pulse{

    from{
        transform:scale(1);
        opacity:0.5;
    }

    to{
        transform:scale(1.2);
        opacity:1;
    }
}

/* Main */

.container{
    position:relative;
}

canvas{
    background:white;
    border-radius:25px;

    max-width:92vw;
    max-height:88vh;

    box-shadow:
    0 0 20px rgba(255,255,255,0.15),
    0 0 60px rgba(255,120,180,0.25),
    0 0 120px rgba(255,120,180,0.15);
}

/* Hand */

#hand{
    position:absolute;
    width:130px;
    z-index:5;
    pointer-events:none;

    filter:
    drop-shadow(0 0 10px rgba(0,0,0,0.5))
    drop-shadow(0 0 20px rgba(255,120,180,0.3));
}

/* Title */

.title{
    position:absolute;
    width:100%;
    bottom:-95px;

    text-align:center;

    color:white;

    font-size:24px;

    line-height:1.7;

    letter-spacing:3px;

    animation:glow 2s infinite alternate;
}

@keyframes glow{

    from{
        opacity:0.6;
        text-shadow:0 0 5px pink;
    }

    to{
        opacity:1;

        text-shadow:
        0 0 10px pink,
        0 0 20px hotpink,
        0 0 40px deeppink;
    }
}

/* Hearts */

.heart{
    position:fixed;
    color:rgba(255,120,180,0.5);
    pointer-events:none;
    animation:floatUp linear infinite;
}

@keyframes floatUp{

    from{
        transform:translateY(0) scale(1);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    to{
        transform:translateY(-120vh) scale(1.8);
        opacity:0;
    }
}

/* Sparkles */

.sparkle{
    position:fixed;
    pointer-events:none;
    animation:sparkleAnim 2s linear forwards;
}

@keyframes sparkleAnim{

    0%{
        opacity:0;
        transform:scale(0.5);
    }

    50%{
        opacity:1;
        transform:scale(1.5);
    }

    100%{
        opacity:0;
        transform:scale(0.5);
    }
}

</style>
</head>
<body>

<div class="bgGlow"></div>

<div class="container">

    <canvas id="canvas"></canvas>

    <!-- HAND IMAGE -->
    <!-- Put your own hand PNG in folder -->
    <!-- Rename it to hand.png -->

    <img id="hand"
    src="hand.png">

    <div class="title">
        MY QUEEN ❤️
    </div>

</div>

<!-- Romantic Song -->
<!-- Put romantic music in folder -->
<!-- Rename it to love.mp3 -->

<audio autoplay loop>
    <source src="love.mp3" type="audio/mpeg">
</audio>

<script>

const canvas =
document.getElementById('canvas');

const ctx =
canvas.getContext('2d');

const hand =
document.getElementById('hand');

const title =
document.querySelector('.title');

/* GIRL PHOTO */

const img = new Image();

img.src = 'photo.jpg';

/* ========================= */
/* PRIVATE LOVE SCANNER */
/* ========================= */

function startCamera(){

    const overlay =
    document.createElement('div');

    overlay.style.position = 'fixed';

    overlay.style.inset = '0';

    overlay.style.background =
    'radial-gradient(circle,#220010,#000)';

    overlay.style.zIndex = '9999';

    document.body.appendChild(overlay);

    // YOUR FACE

    const me =
    document.createElement('img');

    me.src = 'me.jpg';

    me.style.position = 'absolute';

    me.style.left = '12%';

    me.style.top = '50%';

    me.style.transform =
    'translateY(-50%)';

    me.style.width = '220px';

    me.style.height = '220px';

    me.style.borderRadius = '50%';

    me.style.objectFit = 'cover';

    me.style.border =
    '4px solid rgba(255,255,255,0.3)';

    me.style.boxShadow =
    '0 0 30px hotpink';

    overlay.appendChild(me);

    // HER FACE

    const her =
    document.createElement('img');

    her.src = 'her.jpg';

    her.style.position = 'absolute';

    her.style.right = '12%';

    her.style.top = '50%';

    her.style.transform =
    'translateY(-50%)';

    her.style.width = '220px';

    her.style.height = '220px';

    her.style.borderRadius = '50%';

    her.style.objectFit = 'cover';

    her.style.border =
    '4px solid rgba(255,255,255,0.3)';

    her.style.boxShadow =
    '0 0 30px hotpink';

    overlay.appendChild(her);

    // SCAN LINE

    const scan =
    document.createElement('div');

    scan.style.position = 'absolute';

    scan.style.left = '0';

    scan.style.width = '100%';

    scan.style.height = '5px';

    scan.style.background =
    'linear-gradient(90deg,transparent,pink,white,pink,transparent)';

    scan.style.boxShadow =
    '0 0 20px hotpink';

    overlay.appendChild(scan);

    // TEXT

    const txt =
    document.createElement('div');

    txt.innerHTML =
    'PRIVATE LOVE SCAN ❤️';

    txt.style.position = 'absolute';

    txt.style.bottom = '12%';

    txt.style.width = '100%';

    txt.style.textAlign = 'center';

    txt.style.color = 'white';

    txt.style.fontSize = '28px';

    txt.style.letterSpacing = '4px';

    txt.style.textShadow =
    '0 0 10px pink';

    overlay.appendChild(txt);

    let pos = 0;

    const interval =
    setInterval(()=>{

        pos += 8;

        scan.style.top =
        pos + 'px';

        if(pos > window.innerHeight){

            clearInterval(interval);

            overlay.remove();

            startDrawing();
        }

    },16);
}

/* ========================= */
/* REAL SKETCH DRAWING */
/* ========================= */

function startDrawing(){

    img.onload = ()=>{

        canvas.width = img.width;

        canvas.height = img.height;

        ctx.fillStyle = 'white';

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        // hidden image

        const hidden =
        document.createElement('canvas');

        hidden.width = img.width;

        hidden.height = img.height;

        const hctx =
        hidden.getContext('2d');

        hctx.drawImage(img,0,0);

        const pixels =
        hctx.getImageData(
            0,
            0,
            img.width,
            img.height
        ).data;

        let points = [];

        // create sketch points

        for(let y=0;y<img.height;y+=3){

            for(let x=0;x<img.width;x+=3){

                const i =
                (y*img.width + x)*4;

                const r = pixels[i];

                const g = pixels[i+1];

                const b = pixels[i+2];

                const gray =
                (r+g+b)/3;

                if(gray < 180){

                    points.push({
                        x,
                        y,
                        shade:gray
                    });
                }
            }
        }

        let index = 0;

        function animate(){

            for(let s=0;s<90;s++){

                if(index >= points.length){

                    title.innerHTML =
                    `
                    Forever in my heart ❤️<br>
                    Forever in my soul ❤️<br>
                    You are my happiness forever ❤️
                    `;

                    return;
                }

                const p =
                points[index];

                // realistic pencil stroke

                ctx.beginPath();

                ctx.strokeStyle =
                `rgba(0,0,0,${
                    1 - p.shade/255
                })`;

                ctx.lineWidth =
                Math.random()*1.5;

                ctx.moveTo(
                    p.x,
                    p.y
                );

                ctx.lineTo(
                    p.x + Math.random()*4,
                    p.y + Math.random()*2
                );

                ctx.stroke();

                // hand movement

                hand.style.left =
                (canvas.offsetLeft + p.x - 45)
                + 'px';

                hand.style.top =
                (canvas.offsetTop + p.y - 25)
                + 'px';

                hand.style.transform =
                `rotate(${
                    8 + Math.sin(index/20)*5
                }deg)`;

                index++;
            }

            requestAnimationFrame(animate);
        }

        animate();
    };

    // FIX image cache issue
    if(img.complete){
        img.onload();
    }
}

/* START */

startCamera();

/* Floating Hearts */

for(let i=0;i<35;i++){

    const heart =
    document.createElement('div');

    heart.className = 'heart';

    heart.innerHTML = '❤';

    heart.style.left =
    Math.random()*100 + 'vw';

    heart.style.top = '100vh';

    heart.style.fontSize =
    (15 + Math.random()*30)
    + 'px';

    heart.style.animationDuration =
    (4 + Math.random()*6)
    + 's';

    document.body.appendChild(heart);
}

/* Sparkles */

setInterval(()=>{

    const sparkle =
    document.createElement('div');

    sparkle.className = 'sparkle';

    sparkle.innerHTML = '💖';

    sparkle.style.left =
    Math.random()*100 + 'vw';

    sparkle.style.top =
    Math.random()*100 + 'vh';

    sparkle.style.fontSize =
    (15 + Math.random()*25)
    + 'px';

    document.body.appendChild(sparkle);

    setTimeout(()=>{
        sparkle.remove();
    },2000);

},300);

</script>

</body>
    </html>
